<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Estrenos Descargables</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: auto;
            touch-action: pan-x pan-y;
            background-color: var(--config-fondo-body, #020617);
        }
        body.modal-abierto {
            overflow: hidden;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-personalizado::-webkit-scrollbar {
            width: 6px !important;
            height: 6px !important;
            display: block !important;
        }
        .scrollbar-personalizado::-webkit-scrollbar-track {
            background: #0f172a !important;
            border-radius: 10px !important;
        }
        .scrollbar-personalizado::-webkit-scrollbar-thumb {
            background-color: #334155 !important;
            border-radius: 10px !important;
        }
        .scrollbar-personalizado::-webkit-scrollbar-thumb:hover {
            background-color: var(--config-primario, #10b981) !important;
        }
        .dinamico-header-footer {
            background-color: var(--config-fondo-hf, #0f172a) !important;
        }
        .dinamico-tarjeta {
            background-color: var(--config-fondo-tarjeta, #0f172a) !important;
            border-color: var(--config-borde-tarjeta, #1e293b) !important;
        }
        .dinamico-modo-activo {
            background-color: var(--config-primario, #10b981) !important;
            color: var(--config-texto-sobre-primario, #022c22) !important;
            box-shadow: 0 4px 12px var(--config-primario-alpha, rgba(16, 185, 129, 0.35)) !important;
        }
        .dinamico-texto-acento {
            color: var(--config-texto-acento, #34d399) !important;
        }
        .dinamico-badge-primario {
            background-color: var(--config-primario, #10b981) !important;
            color: var(--config-texto-sobre-primario, #022c22) !important;
        }
        .dinamico-borde-buscador {
            border-color: var(--config-borde-buscador-alpha, rgba(16, 185, 129, 0.5)) !important;
        }
        .dinamico-borde-buscador:focus {
            border-color: var(--config-primario, #10b981) !important;
        }
        .dinamico-spinner {
            border-color: var(--config-spinner, #10b981) !important;
            border-top-color: transparent !important;
        }
        .dinamico-error {
            color: var(--config-error, #ef4444) !important;
        }
        .poster-card:hover img {
            transform: scale(1.03);
        }

        :root {
            color-scheme: dark;
            --catalogo-radio: 16px;
        }
        html { scroll-behavior: smooth; }
        body {
            color: #e8e9ec !important;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 15px;
            line-height: 1.55;
            letter-spacing: .01em;
            background-image: radial-gradient(ellipse at top, rgba(184,155,104,.07), transparent 42%);
        }
        button, input, a { -webkit-tap-highlight-color: transparent; }
        button { font: inherit; }
        button:focus-visible, a:focus-visible, input:focus-visible {
            outline: 2px solid var(--config-primario, #b89b68);
            outline-offset: 3px;
        }
        header.dinamico-header-footer {
            background: rgba(27,37,51,.96) !important;
            border-color: #354253 !important;
            box-shadow: 0 8px 28px rgba(0,0,0,.18) !important;
            backdrop-filter: blur(16px);
        }
        #main-title { letter-spacing: .045em; font-size: 1.05rem; }
        #titulo-parte-2 { border-radius: 5px; letter-spacing: .09em; padding: 4px 9px; }
        #btn-toggle-search, #btn-header-whatsapp {
            width: 42px; height: 42px; border-radius: 12px;
            background: #293647 !important; border-color: #435064 !important;
        }
        #btn-header-whatsapp { color: #d7bd8c !important; }
        #btn-modo-1, #btn-modo-2 { min-height: 42px; font-size: .86rem; letter-spacing: .01em; }
        .modo-inactivo { color: #c0c6cf !important; background: transparent; }
        .modo-inactivo:hover { color: #fff !important; background: #2b3747; }
        .dinamico-modo-activo {
            background: var(--config-primario, #b89b68) !important;
            color: var(--config-texto-sobre-primario, #17202b) !important;
            box-shadow: 0 3px 10px var(--config-primario-alpha, rgba(184,155,104,.24)) !important;
        }
        #search-bar-container { max-width: 680px; }
        #input-buscar {
            min-height: 48px; font-size: .95rem; border-radius: 13px;
            background: #202b39 !important; color: #f1f2f4 !important;
            border-width: 1px; box-shadow: none !important;
        }
        #input-buscar::placeholder { color: #9aa4b2; }
        .tarjeta-catalogo, .item-compacto {
            background: linear-gradient(155deg, rgba(36,48,64,.98), rgba(29,40,54,.98)) !important;
            border-color: #3b4859 !important;
            box-shadow: 0 8px 24px rgba(0,0,0,.16) !important;
        }
        .tarjeta-catalogo { padding: 13px !important; border-radius: 17px !important; }
        .poster-card, .item-compacto .aspect-\[2\/3\] {
            background: #111827 !important; border: 1px solid #3b4859;
        }
        .poster-card img, .item-compacto img { display: block; }
        .bloque-ficha {
            padding: 14px; border-radius: 13px; border: 1px solid #3b4859;
            background: rgba(17,26,38,.58); display: flex; flex-direction: column; gap: 13px;
        }
        .selector-version {
            display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
            padding: 4px; border-radius: 10px; background: #151f2c; border: 1px solid #354253;
        }
        .btn-version {
            min-height: 39px; padding: 7px 8px; border-radius: 8px;
            color: #c1c8d1; font-size: .78rem; font-weight: 650;
            transition: background .18s ease, color .18s ease;
        }
        .btn-version.activo { background: var(--config-primario, #b89b68); color: #17202b; }
        .contenedor-datos-version { display: flex; flex-direction: column; gap: 13px; }
        .datos-generales { display: flex; flex-direction: column; gap: 7px; }
        .datos-generales > div, .seccion-ficha > div:not(.lista-etiquetas) {
            display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 8px;
        }
        .datos-generales span, .seccion-ficha > div > span {
            color: #c9ad7b; font-size: .79rem; font-weight: 650;
        }
        .datos-generales strong, .seccion-ficha strong { color: #edf0f3; font-size: .84rem; font-weight: 550; }
        .separador-ficha { height: 1px; background: #3b4859; }
        .seccion-ficha { display: flex; flex-direction: column; gap: 7px; }
        .seccion-ficha h3 {
            color: #d7bd8c; font-size: .75rem; font-weight: 750;
            letter-spacing: .11em;
        }
        .lista-etiquetas { display: flex; flex-direction: column; gap: 6px; }
        .lista-etiquetas span {
            padding: 7px 10px; border-radius: 8px; background: #263345;
            border: 1px solid #3b4859; color: #e0e4e9; font-size: .78rem;
        }
        .seccion-ficha p { color: #d1d6dd; font-size: .82rem; line-height: 1.6; }
        .item-compacto { border-radius: 12px !important; }
        .item-compacto:active { transform: scale(.98); }
        .boton-detalles {
            min-height: 36px; padding: 6px 4px; border-radius: 8px;
            background: #2b394b; border: 1px solid #46566a;
            color: #e2e6eb; font-size: .73rem; font-weight: 650;
        }
        .boton-detalles:hover { background: #35465b; }
        .sin-resultados, .estado-carga, .estado-error {
            padding: 64px 18px; text-align: center; color: #b7c0cb; font-size: .92rem;
        }
        .estado-carga { display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .estado-error p + p { margin-top: 8px; font-size: .84rem; }
        #contenedor-paginacion { gap: 6px; }
        .boton-paginacion {
            min-width: 40px; height: 40px; padding: 0 10px; border-radius: 10px;
            background: #202b39; border: 1px solid #3b4859; color: #d2d8df;
            font-size: .84rem; font-weight: 650;
        }
        .boton-paginacion.activo { background: var(--config-primario, #b89b68); color: #17202b; border-color: transparent; }
        .boton-paginacion:disabled { opacity: .35; cursor: default; }
        .paginacion-puntos { color: #9ca7b5; padding: 0 2px; }
        #modal-detalles { background: rgba(7,12,19,.88) !important; backdrop-filter: blur(7px); }
        #modal-detalles > div { border-color: #465365 !important; background: #202b39 !important; }
        #modal-detalles-contenido { padding: 20px; gap: 20px; }
        .portada-modal { max-width: 280px; aspect-ratio: 2/3; overflow: hidden; border-radius: 12px; margin: 0 auto; background: #111827; }
        #btn-cerrar-modal-detalles { width: 40px; height: 40px; background: #172231 !important; border-color: #526074 !important; }
        footer.dinamico-header-footer {
            background: rgba(27,37,51,.97) !important; border-color: #354253 !important;
            backdrop-filter: blur(16px);
        }
        #btn-footer-whatsapp {
            min-height: 42px; background: #202b39 !important; border-color: #465365 !important;
            color: #d7bd8c !important; font-size: .85rem;
        }
        @media (min-width: 768px) {
            main { padding-top: 24px !important; }
            #modal-detalles > div { max-width: 760px; }
        }
        @media (max-width: 380px) {
            #main-title { font-size: .92rem; }
            #btn-modo-1, #btn-modo-2 { padding-left: 8px; padding-right: 8px; font-size: .78rem; }
            .item-compacto { padding: 5px !important; }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans pb-24">

    <!-- HEADER DE NAVEGACIÓN -->
    <header class="dinamico-header-footer border-b border-slate-800 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-md md:max-w-6xl mx-auto px-4 py-3 flex flex-col gap-3">
            
            <!-- FILA SUPERIOR: TÍTULO + ACCIONES RÁPIDAS -->
            <div class="flex items-center justify-between gap-2">
                <h1 id="main-title" class="text-lg sm:text-xl font-black tracking-wider uppercase cursor-pointer flex items-center flex-wrap gap-1.5 active:scale-95 transition-transform">
                    <span id="titulo-parte-1" class="dinamico-texto-acento">ESTRENOS</span>
                    <span id="titulo-parte-2" class="dinamico-badge-primario text-[11px] sm:text-xs px-2 py-0.5 rounded font-black tracking-widest">DESCARGABLES</span>
                </h1>

                <div class="flex gap-2 items-center shrink-0">
                    <!-- BOTÓN LUPA / BUSCADOR -->
                    <button id="btn-toggle-search" title="Buscar película" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-slate-300 flex items-center justify-center transition-all active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>

                    <!-- BOTÓN WHATSAPP DIRECTO -->
                    <a id="btn-header-whatsapp" href="https://wa.me/51983104072" target="_blank" title="Contactar por WhatsApp" class="w-9 h-9 bg-emerald-500/15 hover:bg-emerald-500/25 rounded-xl border border-emerald-500/40 text-emerald-400 flex items-center justify-center transition-all active:scale-95">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- SELECTOR DE MODOS DE VISTA (BOTÓN MODO 1 Y BOTÓN MODO 2) -->
            <div class="grid grid-cols-2 sm:flex sm:w-fit bg-slate-950 p-1 rounded-xl border border-slate-800 gap-1">
                <button id="btn-modo-1" class="px-4 py-1.5 rounded-lg text-xs font-black transition-all active:scale-95 dinamico-modo-activo flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                    <span id="texto-btn-modo-1">Vista Normal</span>
                </button>
                <button id="btn-modo-2" class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all active:scale-95 flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                    </svg>
                    <span id="texto-btn-modo-2">Vista Compacta</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL RESPONSIVO (MÓVIL Y PC) -->
    <main class="flex-grow max-w-md md:max-w-6xl w-full mx-auto px-3 sm:px-4 pt-3 pb-12">
        
        <!-- BARRA DE BÚSQUEDA -->
        <div id="search-bar-container" class="hidden mb-4 max-w-xl mx-auto transition-all duration-300">
            <div class="relative flex items-center">
                <input type="text" id="input-buscar" placeholder="Buscar película por nombre..." 
                       class="w-full bg-slate-900 text-slate-100 placeholder-slate-500 text-xs sm:text-sm font-medium rounded-xl pl-9 pr-9 py-2.5 border dinamico-borde-buscador focus:outline-none shadow-lg">
                <div class="absolute left-3 dinamico-texto-acento pointer-events-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <button id="btn-limpiar-busqueda" class="hidden absolute right-3 text-slate-400 hover:text-white text-xs font-bold">✕</button>
            </div>
        </div>

        <!-- CONTENEDOR DINÁMICO DE PELÍCULAS -->
        <div id="contenedor-principal"></div>

        <!-- PAGINACIÓN -->
        <div id="contenedor-paginacion" class="flex flex-wrap justify-center items-center gap-1.5 mt-8 py-2"></div>
    </main>

    <!-- MODAL DE DETALLES PARA VISTA COMPACTA -->
    <div id="modal-detalles" class="fixed inset-0 z-[100] bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-3 sm:p-4">
        <div class="dinamico-tarjeta border rounded-2xl max-w-sm md:max-w-2xl w-full max-h-[88vh] shadow-2xl flex flex-col relative overflow-hidden">
            
            <!-- BOTÓN CERRAR -->
            <button id="btn-cerrar-modal-detalles" class="absolute top-3 right-3 z-20 text-slate-300 hover:text-white font-bold text-sm bg-slate-950/90 border border-slate-700 rounded-full w-8 h-8 flex items-center justify-center shadow-lg active:scale-90 transition-transform">
                ✕
            </button>

            <!-- CONTENIDO SCROLLABLE -->
            <div id="modal-detalles-contenido" class="overflow-y-auto scrollbar-personalizado p-4 flex flex-col md:flex-row md:items-start gap-4">
                <!-- Se llena dinámicamente desde app.js -->
            </div>
        </div>
    </div>

    <!-- FOOTER FIJO CON CONTACTO WHATSAPP -->
    <footer class="dinamico-header-footer border-t border-slate-800 fixed bottom-0 left-0 right-0 z-50 backdrop-blur-md">
        <div class="max-w-md md:max-w-6xl mx-auto h-14 flex items-center justify-center px-4">
            <a id="btn-footer-whatsapp" href="https://wa.me/51983104072" target="_blank" class="flex items-center justify-center dinamico-texto-acento font-bold text-xs sm:text-sm gap-2 active:scale-95 transition-transform py-2 px-5 rounded-xl bg-slate-950/60 border border-slate-800 hover:border-emerald-500/40">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                </svg>
                <span id="texto-footer-whatsapp">WhatsApp Soporte</span>
            </a>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
